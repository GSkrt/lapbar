name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest duckdb      # duckdb is optional for LapBar itself; the export tests use it
      # The chart logic (charts/logic.js) is tested under node, which the runner has preinstalled.
      - run: node --version
      - run: python -m pytest -q
