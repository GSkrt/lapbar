[project]
name = "lapbar"
version = "0.1.0"
description = "Quickshell status bar widget showing Strava activity summaries"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lapbar = "lapbar.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lapbar", "lapbar.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
